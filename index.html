
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A2Z Wallpapers - Mobile Wallpapers</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10111b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 10px;
  background: #191a2b;
}

header h1 {
  color: #8b7cff;
  margin: 0;
}

header p {
  color: #aaa;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 15px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.card {
  background: #1c1d2e;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  aspect-ratio: 9 / 16;
  object-fit: cover;
  display: block;
  cursor: pointer;
}

.card h3 {
  font-size: 13px;
  padding: 0 8px;
  text-align: center;
}

.card select,
.card button {
  width: calc(100% - 16px);
  margin: 5px 8px;
  padding: 9px 3px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
}

.card button {
  background: #7867ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 30px;
  color: #aaa;
}

@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }

  .card h3 {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>A2Z Wallpapers</h1>
  <p>4K • 2K • Full HD • Mobile Wallpapers</p>
</header>

<div class="container">
  <div class="gallery" id="gallery"></div>
</div>

<footer>
  © 2026 A2Z Wallpapers
</footer>

<script>
const wallpapers = [
  {
    name: "Beautiful Nature",
    image: "wallpapers/Tamannaah Bhatia.png"
  },
  {
    name: "AMOLED Wallpaper",
    image: "wallpapers/amoled.jpg"
  },
  {
    name: "Flowers Wallpaper",
    image: "wallpapers/flowers.jpg"
  }
];

const resolutions = [
  { name: "4K Mobile", width: 2160, height: 3840 },
  { name: "2K Mobile", width: 1440, height: 2560 },
  { name: "Full HD+", width: 1080, height: 2400 },
  { name: "Full HD", width: 1080, height: 1920 },
  { name: "HD", width: 720, height: 1280 }
];

const gallery = document.getElementById("gallery");

wallpapers.forEach((wallpaper, index) => {

  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = wallpaper.image;
  img.alt = wallpaper.name;
  img.loading = "lazy";

  const title = document.createElement("h3");
  title.textContent = wallpaper.name;

  const select = document.createElement("select");

  resolutions.forEach((r, i) => {
    const option = document.createElement("option");
    option.value = i;
    option.textContent =
      `${r.name} (${r.width} × ${r.height})`;
    select.appendChild(option);
  });

  const button = document.createElement("button");
  button.textContent = "Download";

  button.onclick = () => {
    downloadWallpaper(wallpaper, select.value);
  };

  card.append(img, title, select, button);
  gallery.appendChild(card);

});

function downloadWallpaper(wallpaper, resolutionIndex) {

  const image = new Image();
  image.crossOrigin = "anonymous";

  image.onload = () => {

    const r = resolutions[resolutionIndex];

    const canvas = document.createElement("canvas");
    canvas.width = r.width;
    canvas.height = r.height;

    const ctx = canvas.getContext("2d");

    const scale = Math.max(
      r.width / image.width,
      r.height / image.height
    );

    const cropWidth = r.width / scale;
    const cropHeight = r.height / scale;

    const x = (image.width - cropWidth) / 2;
    const y = (image.height - cropHeight) / 2;

    ctx.drawImage(
      image,
      x, y, cropWidth, cropHeight,
      0, 0, r.width, r.height
    );

    canvas.toBlob(blob => {

      if (!blob) {
        alert("Wallpaper processing failed");
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download =
        wallpaper.name.replace(/\s+/g, "-") +
        "-" + r.width + "x" + r.height + ".jpg";

      link.click();

      setTimeout(() => URL.revokeObjectURL(url), 1000);

    }, "image/jpeg", 0.95);
  };

  image.onerror = () => {
    alert("Wallpaper load failed. Check the image path.");
  };

  image.src = wallpaper.image;
}
</script>

</body>
</html>
