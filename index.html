
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A2Z Wallpapers - 4K Mobile Wallpapers</title>

<meta name="description" content="Download beautiful 4K, 2K and HD mobile wallpapers from A2Z Wallpapers.">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10111b;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

header {
  background: #191a2b;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  color: #8b7cff;
  margin: 0;
  font-size: 28px;
}

header p {
  color: #bbbbbb;
  margin-bottom: 0;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 15px;
}

.search-box {
  width: 100%;
  padding: 13px;
  margin-bottom: 20px;
  border-radius: 10px;
  border: 1px solid #333449;
  background: #1c1d2e;
  color: white;
  font-size: 16px;
}

.gallery {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.card {
  background: #1c1d2e;
  border-radius: 12px;
  overflow: hidden;
  min-width: 0;
}

.card img {
  width: 100%;
  height: auto;
  aspect-ratio: auto;
  object-fit: contain;
  display: block;
  cursor: pointer;
}

.card h3 {
  font-size: 13px;
  text-align: center;
  padding: 0 5px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.card select,
.card button {
  display: block;
  width: calc(100% - 12px);
  margin: 6px;
  padding: 9px 2px;
  border: none;
  border-radius: 7px;
  font-size: 11px;
}

.card select {
  background: #303146;
  color: white;
}

.card button {
  background: #7867ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.card button:hover {
  background: #6553e8;
}

#message {
  text-align: center;
  color: #aaa;
  padding: 20px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #aaaaaa;
}

@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
  }

  .card h3 {
    font-size: 16px;
  }

  .card select,
  .card button {
    font-size: 14px;
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>A2Z Wallpapers</h1>
  <p>Beautiful Mobile Wallpapers | 4K | 2K | HD</p>
</header>

<div class="container">

  <input
    type="search"
    id="search"
    class="search-box"
    placeholder="Search wallpapers..."
  >

  <div class="gallery" id="gallery"></div>

  <p id="message"></p>

</div>

<footer>
  © 2026 A2Z Wallpapers
</footer>

<script>

// =====================================
// WALLPAPER LIST
// GitHub-ൽ Upload ചെയ്യുന്ന ചിത്രങ്ങളുടെ
// പേരുകൾ ഇവിടെ ചേർക്കുക.
// =====================================

const wallpapers = [

  {
    name: "Ritika Nayak 8K Wallpaper",
    image: "wallpapers/Ritika Nayak 8k Wallpaper.jpg"
  },
  
  {
    name: "Tamannaah Bhatia",
    image: "wallpapers/Tamannaah Bhatia.png"
  },

  {
    name: "AMOLED Wallpaper",
    image: "wallpapers/amoled.jpg"
  },

  {
    name: "Beautiful Flowers",
    image: "wallpapers/flowers.jpg"
  }

];

// =====================================
// DOWNLOAD RESOLUTIONS
// =====================================

const resolutions = [
  { name: "Download Original", original: true },
  { name: "Download 4K (2160 × 3840)", width: 2160, height: 3840, quality: 0.82 },
  { name: "Download 2K (1440 × 2560)", width: 1440, height: 2560, quality: 0.85 },
  { name: "Download Full HD+ (1080 × 2400)", width: 1080, height: 2400, quality: 0.88 },
  { name: "Download Full HD (1080 × 1920)", width: 1080, height: 1920, quality: 0.88 },
  { name: "Download HD (720 × 1280)", width: 720, height: 1280, quality: 0.88 }
];

// =====================================
// CREATE WALLPAPER GALLERY
// =====================================

const gallery = document.getElementById("gallery");

function createGallery(list) {

  gallery.innerHTML = "";

  document.getElementById("message").textContent =
    list.length ? "" : "No wallpapers found.";

  list.forEach((wallpaper) => {

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");

    img.src = wallpaper.image;
    img.alt = wallpaper.name;
    img.loading = "lazy";

    img.onerror = () => {
      img.alt = "Wallpaper not found";
    };

    const title = document.createElement("h3");
    title.textContent = wallpaper.name;

    const select = document.createElement("select");

    resolutions.forEach((r, index) => {

      const option = document.createElement("option");

      option.value = index;

      option.textContent = r.name;

      select.appendChild(option);

    });

    const button = document.createElement("button");

    button.textContent = "Download";

    button.onclick = () => {

      downloadWallpaper(
        wallpaper,
        Number(select.value)
      );

    };

    card.append(
      img,
      title,
      select,
      button
    );

    gallery.appendChild(card);

  });

}

// =====================================
// DOWNLOAD WALLPAPER
// =====================================

async function downloadWallpaper(wallpaper, resolutionIndex) {

  const resolution = resolutions[resolutionIndex];

  try {
    const response = await fetch(wallpaper.image);
    if (!response.ok) throw new Error("Wallpaper not found");

    const originalBlob = await response.blob();

    // ORIGINAL: download the source file unchanged, without resizing/compression.
    if (resolution.original) {
      const url = URL.createObjectURL(originalBlob);
      const link = document.createElement("a");
      const extension = getOriginalExtension(wallpaper.image, originalBlob.type);

      link.href = url;
      link.download =
        wallpaper.name.replace(/[^a-z0-9-]+/gi, "-") +
        "-Original." + extension;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 3000);
      return;
    }

    // Resize and compress the selected version.
    const imageUrl = URL.createObjectURL(originalBlob);
    const image = new Image();

    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = reject;
      image.src = imageUrl;
    });

    const width = resolution.width;
    const height = resolution.height;
    const canvas = document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");

    // Center crop to the selected mobile portrait ratio.
    const targetRatio = width / height;
    const sourceRatio = image.naturalWidth / image.naturalHeight;

    let sx = 0, sy = 0;
    let sw = image.naturalWidth;
    let sh = image.naturalHeight;

    if (sourceRatio > targetRatio) {
      sw = image.naturalHeight * targetRatio;
      sx = (image.naturalWidth - sw) / 2;
    } else {
      sh = image.naturalWidth / targetRatio;
      sy = (image.naturalHeight - sh) / 2;
    }

    ctx.drawImage(image, sx, sy, sw, sh, 0, 0, width, height);
    URL.revokeObjectURL(imageUrl);

    // 4K: target approximately 2 MB by adjusting JPEG quality.
    // Other resolutions use their preset quality.
    let outputBlob;

    if (width === 2160 && height === 3840) {
      outputBlob = await makeJpegNearTarget(canvas, 2 * 1024 * 1024);
    } else {
      outputBlob = await canvasToBlob(canvas, "image/jpeg", resolution.quality || 0.85);
    }

    if (!outputBlob) {
      alert("Wallpaper processing failed.");
      return;
    }

    const url = URL.createObjectURL(outputBlob);
    const link = document.createElement("a");

    link.href = url;
    link.download =
      wallpaper.name.replace(/[^a-z0-9-]+/gi, "-") +
      "-" + width + "x" + height + ".jpg";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 3000);

  } catch (error) {
    console.error(error);
    alert("Wallpaper download failed. Please check the image file.");
  }
}


// Convert canvas to JPEG and aim for a target file size.
// Browser JPEG compression is approximate; the final size can vary by image.
function canvasToBlob(canvas, type, quality) {
  return new Promise((resolve) => canvas.toBlob(resolve, type, quality));
}

async function makeJpegNearTarget(canvas, targetBytes) {
  let low = 0.30;
  let high = 0.92;
  let bestBlob = await canvasToBlob(canvas, "image/jpeg", high);

  // If already near/below target at high quality, keep the higher quality.
  if (bestBlob && bestBlob.size <= targetBytes) return bestBlob;

  // Find the highest JPEG quality that is at or below ~2 MB.
  for (let i = 0; i < 7; i++) {
    const quality = (low + high) / 2;
    const blob = await canvasToBlob(canvas, "image/jpeg", quality);
    if (!blob) continue;

    if (blob.size <= targetBytes) {
      bestBlob = blob;
      low = quality;  // try a little higher quality while staying near target
    } else {
      high = quality; // too large: reduce quality
    }
  }

  // If the image is extremely detailed and even low quality exceeds target,
  // return the smallest tested version rather than failing the download.
  const lowestQualityBlob = await canvasToBlob(canvas, "image/jpeg", 0.30);
  if (lowestQualityBlob && lowestQualityBlob.size <= targetBytes) return bestBlob || lowestQualityBlob;
  return lowestQualityBlob || bestBlob;
}

// Preserve original file extension when downloading the source.
function getOriginalExtension(imagePath, mimeType) {
  const path = imagePath.split("?")[0].toLowerCase();
  const match = path.match(/\.([a-z0-9]+)$/);

  if (match) return match[1];
  if (mimeType === "image/png") return "png";
  if (mimeType === "image/webp") return "webp";
  if (mimeType === "image/gif") return "gif";

  return "jpg";
}

// SEARCH WALLPAPERS
// =====================================

document.getElementById("search").addEventListener(
  "input",
  function() {

    const searchText = this.value.toLowerCase();

    const filtered = wallpapers.filter(w =>
      w.name.toLowerCase().includes(searchText)
    );

    createGallery(filtered);

  }
);

// =====================================
// START WEBSITE
// =====================================

createGallery(wallpapers);

</script>

</body>
</html>
